<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALEXOR - Números Virtuales</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050505; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Inter',sans-serif; }
  .card { width:900px; background:#0a0a0a; border:1px solid #2a0000; position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:-60px; right:-60px; width:350px; height:350px; background:radial-gradient(circle,rgba(209,0,0,0.18) 0%,transparent 70%); pointer-events:none; }
  .card::after { content:''; position:absolute; bottom:-80px; left:-80px; width:300px; height:300px; background:radial-gradient(circle,rgba(209,0,0,0.1) 0%,transparent 70%); pointer-events:none; }
  .top-bar { height:4px; background:linear-gradient(90deg,#D10000,#FF4444,#D10000); }
  .inner { padding:48px 52px; position:relative; z-index:1; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:40px; }
  .logo-area { display:flex; align-items:center; gap:16px; }
  .logo-img { width:72px; height:72px; object-fit:contain; }
  .logo-name { font-family:'Rajdhani',sans-serif; font-size:2rem; font-weight:700; color:#fff; letter-spacing:0.12em; line-height:1; }
  .logo-name span { color:#D10000; }
  .logo-tagline { font-size:0.68rem; letter-spacing:0.25em; color:#666; text-transform:uppercase; margin-top:2px; }
  .header-right { text-align:right; }
  .service-eyebrow { font-size:0.65rem; letter-spacing:0.3em; color:#D10000; text-transform:uppercase; margin-bottom:4px; }
  .service-title { font-family:'Rajdhani',sans-serif; font-size:1.8rem; font-weight:700; color:#fff; letter-spacing:0.05em; }
  .main { display:flex; gap:40px; align-items:flex-start; margin-bottom:36px; }
  .left { flex:1; }
  .big-headline { font-family:'Rajdhani',sans-serif; font-size:3.2rem; font-weight:700; color:#fff; line-height:1; letter-spacing:0.02em; margin-bottom:8px; }
  .big-headline .red { color:#D10000; }
  .sub-headline { font-size:0.95rem; color:#777; line-height:1.6; margin-bottom:28px; max-width:400px; }
  .features { list-style:none; display:flex; flex-direction:column; gap:10px; }
  .feature { display:flex; align-items:center; gap:10px; font-size:0.88rem; color:#ccc; }
  .feature-dot { width:6px; height:6px; background:#D10000; border-radius:50%; flex-shrink:0; }
  .right { width:220px; flex-shrink:0; }
  .price-box { background:linear-gradient(135deg,#1a0000,#110000); border:1px solid #3a0000; padding:24px; text-align:center; border-radius:4px; margin-bottom:16px; }
  .price-label { font-size:0.65rem; letter-spacing:0.2em; color:#666; text-transform:uppercase; margin-bottom:8px; }
  .price-value { font-family:'Rajdhani',sans-serif; font-size:1.1rem; font-weight:700; color:#D10000; line-height:1.3; }
  .platforms { display:flex; flex-direction:column; gap:8px; }
  .platform { display:flex; align-items:center; gap:8px; background:#111; border:1px solid #1e1e1e; padding:10px 14px; border-radius:3px; font-size:0.82rem; color:#bbb; font-weight:500; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px; }
  .tag { font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; border:1px solid #2a0000; color:#D10000; padding:4px 12px; border-radius:2px; font-family:'Rajdhani',sans-serif; font-weight:600; }
  .cta-bar { display:flex; align-items:center; justify-content:space-between; background:linear-gradient(90deg,#1a0000,#0d0000); border:1px solid #2a0000; padding:18px 24px; border-radius:3px; }
  .cta-label { font-size:0.65rem; letter-spacing:0.2em; color:#666; text-transform:uppercase; margin-bottom:3px; }
  .cta-contact { font-family:'Rajdhani',sans-serif; font-size:1.1rem; font-weight:700; color:#fff; letter-spacing:0.05em; }
  .cta-contact span { color:#D10000; }
  .cta-btns { display:flex; gap:10px; }
  .btn-wa { background:#25D366; color:#fff; padding:9px 18px; border-radius:2px; font-family:'Rajdhani',sans-serif; font-size:0.85rem; font-weight:700; letter-spacing:0.05em; }
  .btn-tg { background:#229ED9; color:#fff; padding:9px 18px; border-radius:2px; font-family:'Rajdhani',sans-serif; font-size:0.85rem; font-weight:700; letter-spacing:0.05em; }
  .bottom-bar { height:3px; background:linear-gradient(90deg,transparent,#D10000,transparent); }
</style>
</head>
